<style>:root{padding-top:env(safe-area-inset-top,0px)}body{margin:0}

}

  --ok:#69d596;--ok-bg:#16301f;--warn:#f1c45e;--warn-bg:#36290d;--alert:#ff9d6e;--alert-bg:#3b2214;--bad:#ff8f86;--bad-bg:#3c1b18;--info:#8bb7f4;--info-bg:#1a2a43;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#111513;--surface:#1a1f1c;--surface2:#242b27;--fg:#e8eee9;--muted:#9aa8a0;--line:#2e3833;
  --accent:#52c7a5;--accent-fg:#07251c;--accent-soft:#1b3b31;
  --ok:#69d596;--ok-bg:#16301f;--warn:#f1c45e;--warn-bg:#36290d;--alert:#ff9d6e;--alert-bg:#3b2214;--bad:#ff8f86;--bad-bg:#3c1b18;--info:#8bb7f4;--info-bg:#1a2a43;
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--fg);font:15px/1.45 "Manrope",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(var(--nav-h) + 28px);min-height:100vh}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0;line-height:1.2;text-wrap:balance}
h2{font-size:15px;font-weight:700;letter-spacing:.01em}
h3{font-size:14px;font-weight:700}
p{margin:0}
a{color:var(--accent)}
.num,.money{font-variant-numeric:tabular-nums}
.wrap{max-width:680px;margin:0 auto;min-width:0}
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 0 10px}
.top h1{font-size:20px;font-weight:800;letter-spacing:-.01em}
.top small{display:block;color:var(--muted);font-size:12px;font-weight:500}
.sync{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:600;padding:5px 10px;border-radius:99px;background:var(--surface2);color:var(--muted);white-space:nowrap;border:0;cursor:pointer}
.sync i{width:8px;height:8px;border-radius:50%;background:var(--muted);display:inline-block}
.sync.ok i{background:var(--ok)}.sync.warn i{background:var(--warn)}.sync.bad i{background:var(--bad)}
.stack{display:flex;flex-direction:column;gap:14px;min-width:0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;box-shadow:var(--shadow);min-width:0}
.card.flat{box-shadow:none}
.card h2{margin-bottom:10px}
.row{display:flex;align-items:center;gap:10px;min-width:0}
.row.sb{justify-content:space-between}
.row.wrapr{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:420px){.grid2.stackm{grid-template-columns:1fr}}
.muted{color:var(--muted)}.small{font-size:12.5px}.tiny{font-size:11.5px}
.right{text-align:right}.bold{font-weight:700}
.ellip{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pos{color:var(--ok)}.neg{color:var(--bad)}
.hero{padding:18px 16px 16px}
.hero .lbl{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.hero .big{font-size:38px;font-weight:800;letter-spacing:-.02em;line-height:1.1;margin:4px 0 8px}
.hero .big.neg{color:var(--bad)}
.bar{position:relative;height:10px;background:var(--surface2);border-radius:99px;overflow:visible;margin:10px 0 6px}
.bar>b{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:var(--accent);max-width:100%}
.bar.s-atencao>b{background:var(--warn)}.bar.s-limite>b{background:var(--alert)}.bar.s-ultrapassado>b{background:var(--bad)}
.bar>i{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--fg);opacity:.45;border-radius:2px}
.badge{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--surface2);color:var(--fg);white-space:nowrap}
.badge svg{width:14px;height:14px}
.b-dentro,.b-ok,.b-Paga{background:var(--ok-bg);color:var(--ok)}
.b-atencao,.b-warn,.b-Parcialmente,.b-Fechada{background:var(--warn-bg);color:var(--warn)}
.b-limite,.b-alert,.b-Divergente{background:var(--alert-bg);color:var(--alert)}
.b-ultrapassado,.b-bad,.b-Vencida{background:var(--bad-bg);color:var(--bad)}
.b-info,.b-Aberta{background:var(--info-bg);color:var(--info)}
.tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:6px;background:var(--surface2);color:var(--muted);white-space:nowrap}
.tag.warn{background:var(--warn-bg);color:var(--warn)}.tag.info{background:var(--info-bg);color:var(--info)}.tag.bad{background:var(--bad-bg);color:var(--bad)}
.alert{display:flex;gap:10px;padding:11px 12px;border-radius:12px;font-size:13.5px;align-items:flex-start;border:0;width:100%;text-align:left;background:var(--info-bg);color:var(--fg)}
.alert svg{flex:none;width:18px;height:18px;margin-top:1px}
.alert.alto{background:var(--bad-bg)}.alert.alto svg{color:var(--bad)}
.alert.medio{background:var(--warn-bg)}.alert.medio svg{color:var(--warn)}
.alert.info svg{color:var(--info)}
button.alert{cursor:pointer}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:var(--surface);font-weight:700;cursor:pointer;text-decoration:none;color:var(--fg)}
.btn svg{width:18px;height:18px}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.ghost{background:transparent}
.btn.sm{min-height:36px;padding:0 12px;font-size:13.5px;border-radius:10px}
.btn.block{width:100%}
.btn[disabled]{opacity:.5;cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.seg{display:flex;background:var(--surface2);padding:3px;border-radius:12px;gap:2px}
.seg button{flex:1;min-height:38px;border:0;background:transparent;border-radius:10px;font-weight:700;color:var(--muted);cursor:pointer;padding:0 8px;font-size:13.5px}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chipb{min-height:40px;padding:0 14px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-weight:600;cursor:pointer;font-size:14px}
.chipb[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--fg);box-shadow:inset 0 0 0 1px var(--accent)}
.field{display:flex;flex-direction:column;gap:6px;min-width:0}
.field>label,.lab{font-size:13px;font-weight:700;color:var(--muted)}
input,select,textarea{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--surface);color:var(--fg);min-width:0}
textarea{min-height:70px;resize:vertical}
input[aria-invalid="true"],select[aria-invalid="true"]{border-color:var(--bad)}
.err{color:var(--bad);font-size:12.5px;font-weight:600}
.hint{color:var(--muted);font-size:12.5px}
.money-in{font-size:26px;font-weight:800;min-height:56px;letter-spacing:-.01em}
.nav{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.nav>div{max-width:680px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);padding:0 max(8px,env(safe-area-inset-left,0px)) 0 max(8px,env(safe-area-inset-right,0px))}
.nav a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:var(--nav-h);font-size:11px;font-weight:700;color:var(--muted);text-decoration:none;position:relative}
.nav a svg{width:23px;height:23px}
.nav a[aria-current="page"]{color:var(--accent)}
.nav a[aria-current="page"]::before{content:"";position:absolute;top:0;left:28%;right:28%;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.nav a.plus span.fab{display:flex;align-items:center;justify-content:center;width:50px;height:50px;margin-top:-18px;border-radius:50%;background:var(--accent);color:var(--accent-fg);box-shadow:0 4px 12px rgba(0,0,0,.25)}
.nav a.plus span.fab svg{width:26px;height:26px}
.nav a.plus[aria-current="page"]::before{display:none}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li button.main{all:unset;display:flex;gap:10px;align-items:center;flex:1;min-width:0;cursor:pointer;padding:2px 0}
.li .t{font-weight:600;min-width:0}
.li .s{font-size:12.5px;color:var(--muted)}
.li .v{font-weight:800;white-space:nowrap}
.li.del .t,.li.del .v{text-decoration:line-through;opacity:.6}
.detail{padding:10px 12px;margin:0 0 10px;background:var(--surface2);border-radius:12px;display:flex;flex-direction:column;gap:8px;font-size:13.5px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:5px 0;border-top:1px dashed var(--line);font-size:14px}
.kv:first-child{border-top:0}
.kv span:first-child{color:var(--muted)}
.kv b{text-align:right}
.day{font-size:12px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);padding:14px 0 2px}
.cyc{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cyc button{width:44px;height:44px;border-radius:12px;border:1px solid var(--line);background:var(--surface);cursor:pointer;display:flex;align-items:center;justify-content:center}
.cyc button svg{width:20px;height:20px}
.cyc .mid{text-align:center;min-width:0}
.cyc .mid b{display:block;font-size:16px}
.mini{display:flex;flex-direction:column;gap:4px}
.mini .n{font-size:22px;font-weight:800;letter-spacing:-.01em}
.sheet-bg{position:fixed;inset:0;background:rgba(10,15,12,.55);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;display:flex;flex-direction:column;gap:14px}
@media (min-width:700px){.sheet-bg{align-items:center}.sheet{border-radius:20px}}
.sheet h2{font-size:18px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--nav-h) + 14px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--fg);color:var(--bg);padding:10px 14px;border-radius:12px;display:flex;gap:14px;align-items:center;max-width:calc(100vw - 32px);box-shadow:0 6px 20px rgba(0,0,0,.3);font-weight:600;font-size:14px}
.toast button{all:unset;cursor:pointer;font-weight:800;text-decoration:underline;color:inherit;padding:6px 2px}
table{border-collapse:collapse;width:100%}
.scroll-x{overflow-x:auto}
th,td{text-align:left;padding:8px 8px;border-top:1px solid var(--line);font-size:13.5px;white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);border-top:0}
td.r,th.r{text-align:right}
.mbar{display:flex;align-items:flex-end;gap:6px;height:110px;margin-top:6px}
.mbar .c{flex:1;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:4px;min-width:0;height:100%}
.mbar .c b{display:block;width:100%;background:var(--accent);border-radius:6px 6px 2px 2px;min-height:2px}
.mbar .c b.old{background:var(--info)}
.mbar .c span{font-size:10.5px;color:var(--muted);font-weight:600}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;background:var(--accent)}
.legend i.old{background:var(--info)}
.empty{text-align:center;padding:26px 10px;color:var(--muted)}
details>summary{cursor:pointer;font-weight:700;padding:6px 0;list-style:none;display:flex;align-items:center;justify-content:space-between;min-height:40px}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:"+";font-size:20px;color:var(--muted)}
details[open]>summary::after{content:"\2212"}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hr{height:1px;background:var(--line);margin:4px 0}
.prog{height:6px;background:var(--surface2);border-radius:9px;overflow:hidden}
.prog b{display:block;height:100%;background:var(--accent)}
svg.spark{width:100%;height:90px}
.menu a{display:flex;align-items:center;gap:14px;padding:14px 4px;border-top:1px solid var(--line);text-decoration:none;color:var(--fg);font-weight:700;min-height:56px}
.menu a:first-child{border-top:0}
.menu a svg{width:22px;height:22px;color:var(--accent);flex:none}
.menu a small{display:block;color:var(--muted);font-weight:500;font-size:12.5px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* Meu Controle Financeiro — motor de cálculo.

(function (root, factory) {

'use strict';

/* ============ dinheiro ============ */
function parseMoney(input) {
  if (typeof input === 'number') return Number.isFinite(input) ? Math.round(input * 100) : NaN;
  var s = String(input == null ? '' : input).trim();
  if (!s) return NaN;
  s = s.replace(/R\$\s*/gi, '').replace(/\s/g, '');
  var neg = false;
  if (s[0] === '-' || s[0] === '−') { neg = true; s = s.slice(1); }

  var lc = s.lastIndexOf(','), ld = s.lastIndexOf('.');

  else if (ld >= 0 && lc < 0 && /^\d{1,3}(\.\d{3})+$/.test(s)) { ip = s.replace(/\./g, ''); }
  else if (ld >= 0 && ld > lc) { ip = s.slice(0, ld).replace(/[.,]/g, ''); dp = s.slice(ld + 1); }
  else ip = s.replace(/[.,]/g, '');

  var c = parseInt(ip || '0', 10) * 100 + parseInt((dp + '00').slice(0, 2), 10);
  return neg ? -c : c;
}
function fmt(c) {
  if (c == null || isNaN(c)) return '—';
  var neg = c < 0, a = Math.abs(Math.round(c));

  return (neg ? '−' : '') + 'R$ ' + String(i).replace(/\B(?=(\d{3})+(?!\d))/g, '.') + ',' + d;
}
function fmtIn(c) { // para campos de entrada: 1234,56
  if (c == null || isNaN(c)) return '';

  return (neg ? '-' : '') + Math.floor(a / 100) + ',' + String(a % 100).padStart(2, '0');

/* ============ datas (ISO YYYY-MM-DD, sem fuso) ============ */
var pad2 = function (n) { return String(n).padStart(2, '0'); };
function pd(s) { var a = String(s).split('-'); return { y: +a[0], m: +a[1], d: +a[2] }; }

function dim(y, m) { return new Date(Date.UTC(y, m, 0)).getUTCDate(); }
function isoOk(s) {

function addM(k, n) { var a = k.split('-'), t = (+a[0]) * 12 + (+a[1] - 1) + n; return Math.floor(t / 12) + '-' + pad2(t % 12 + 1); }
function dayOf(k, d) { var a = k.split('-'); return mk(+a[0], +a[1], Math.min(d, dim(+a[0], +a[1]))); }

/* ciclos de orçamento: dia 28 a dia 27 */
function cycleStartDate(s, sd) {

/* ============ estado inicial ============ */
function defaultSettings() {
  return { teto: 350000, orcAlim: 150000, orcOutras: 200000, inicio: '2026-10-28', cicloDia: 28,
